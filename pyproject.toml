[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-autonomous-road-simulator"
version = "0.1.0"
description = "CUDA-accelerated adaptive path-planning simulation for unstructured roads"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
sih-sim = "sih_sim.cli:main"

[tool.setuptools.packages.find]
include = ["sih_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
